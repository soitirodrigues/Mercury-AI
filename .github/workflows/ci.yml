name: Mercury CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest discover -s mercury_ai/test -v

      - name: Run Performance Benchmarks
        run: python -m pytest mercury_ai/tests/test_performance_benchmarks.py
        env:
          PERFORMANCE_THRESHOLD: 0.95  # 95% performance retention required

      - name: Check Regression
        run: python mercury_ai/performance_benchmarking.py --check-regression
        env:
          REGRESSION_THRESHOLD: 5%  # Allow up to 5% regression
