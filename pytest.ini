[pytest]
# Impede o pytest de varrer diretórios que não contêm testes.
# A varredura (scandir/stat) desses diretórios causava hang de filesystem
# (antivírus/drive) durante a coleta da suíte completa.
norecursedirs =
    .git
    .venv
    .mypy_cache
    .pytest_cache
    __pycache__
    .agent-cache
    .agents
    .continue
    .gemini
    .github
    .mercury
    app
    artifacts
    AUDIT_V1
    data
    decision_scenario_results
    determinism_test_results
    docs
    logs
    Mercury_AI_V1
    release
    reports
    S31_evidence_pack
    S32-E3-FORENSIC
    scripts
    tmp
    tools